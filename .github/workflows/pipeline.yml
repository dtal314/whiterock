name: pipeline

on:
  schedule:
    - cron: "15 11 * * 1-5"   # weekdays, about 7:15 am US Eastern
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: whiterock-pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Update data, retrain, build site
        env:
          PYTHONUNBUFFERED: "1"
        run: python -m whiterock.run_pipeline --update
      - name: Commit refreshed data
        run: |
          git config user.name "whiterock-pipeline"
          git config user.email "actions@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "data: pipeline refresh $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
